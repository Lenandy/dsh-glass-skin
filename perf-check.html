<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>pending</title>
<style>
  :root {
    --dsw-alias-bg-base: #ffffff;
    --dsw-specific-sidebar-fill: #f2f4f7;
    --dsw-specific-menu: #ffffff;
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-border-l2: rgba(15,17,21,.11);
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #4b525c;
    --dsw-alias-label-tertiary: #6f7780;
    --dsw-alias-interactive-bg-hover: rgba(15,17,21,.06);
    --dsw-radius-sm: 6px;
    --dsw-font-family: system-ui, sans-serif;
    background: #eef1f7;
  }
  html, body { margin: 0; height: 100%; }
  #root { height: 100%; }
  .frame { height: 100%; background: var(--dsw-specific-sidebar-fill); display: grid;
           grid-template-rows: 36px minmax(0, 1fr); }
  .work { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 0; }
  .sidebar { padding: 8px; overflow: hidden; }
  .row { height: 26px; color: var(--dsw-alias-label-secondary); }
  .content { background: var(--dsw-alias-bg-base); min-height: 0; overflow: hidden; }
  .viewRoot { background: var(--dsw-alias-bg-base); height: 100%; overflow: hidden; }
  .msg { padding: 2px 10px; }
  .say { color: var(--dsw-alias-label-primary); }
  .card { background: #fff; height: 18px; }
  #report { position: fixed; left: 8px; top: 8px; z-index: 2147483600; margin: 0; padding: 8px;
            background: #000e; color: #9fe8ff; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="root">
  <div class="frame">
    <div class="chrome"></div>
    <div class="work">
      <div class="sidebar" id="sidebar"></div>
      <div class="content"><div class="viewRoot"><div id="flow"></div></div></div>
    </div>
  </div>
</div>
<pre id="report">pending</pre>

<script>
  // A DOM the size of a real long conversation: the skin's measurements walk the
  // ancestor chain with getComputedStyle, and on a small mock that cost hides.
  (function () {
    var flow = document.getElementById('flow')
    var html = ''
    for (var i = 0; i < 1200; i++) {
      html += '<div class="msg"><div class="say"><p>line ' + i + ' <code>token</code> '
        + '<span>more</span></p><ol><li>a</li><li>b</li><li>c</li><li>d</li></ol></div>'
        + '<div class="card"><span>card ' + i + '</span></div></div>'
    }
    flow.innerHTML = html
    var sidebar = document.getElementById('sidebar')
    var rows = ''
    for (var j = 0; j < 60; j++) rows += '<div class="row">session ' + j + '</div>'
    sidebar.innerHTML = rows
  })()
</script>
<script>
  window.__ModuleLoader__ = { load: function (definition) { window.__def = definition } }
</script>
<script src="lib/client.js"></script>
<script>
(function () {
  var out = { nodes: document.getElementsByTagName('*').length, scenarios: {} }
  var handlers = {}
  var mode = 'light'

  // The unit that actually costs: every overrideTokens call makes the presenter
  // recompute its token map and notify every subscriber, which on a long
  // conversation is a full re-render. Count them.
  var overrideCalls = 0

  var base = {
    light: { '--dsw-alias-bg-base': '#ffffff', '--dsw-specific-sidebar-fill': '#f2f4f7',
             '--dsw-specific-menu': '#ffffff', '--dsw-alias-bg-overlay': '#ffffff' },
    dark: { '--dsw-alias-bg-base': '#16181c', '--dsw-specific-sidebar-fill': '#101215',
            '--dsw-specific-menu': '#22262c', '--dsw-alias-bg-overlay': '#1a1d22' },
  }

  var theme = {
    getTheme: function () {
      return { preference: mode, fontSize: 14, revision: 1,
               active: { id: mode, colorScheme: mode, tokens: {} }, themes: [] }
    },
    setTheme: function () {},
    setFontSize: function () {},
    register: function () { return function () {} },
    overrideTokens: function (source, pairs) {
      overrideCalls++
      Object.keys(pairs).forEach(function (token) {
        document.body.style.setProperty(token, pairs[token][mode], 'important')
      })
      return function () {}
    },
  }

  var mod = window.__def.factory(function () { throw new Error('no module') })
  mod.apply({
    theme: theme,
    get: function (name) { return name === 'theme' ? theme : undefined },
    on: function (event, handler) { handlers[event] = handler },
  })
  var api = window.__dshGlassSkin
  api.panel(true)
  void document.body.offsetHeight

  function panelNodes() {
    var all = []
    var root = document.getElementById('dsh-glass-skin-panel')
    ;(function walk(node) {
      for (var i = 0; i < node.children.length; i++) { all.push(node.children[i]); walk(node.children[i]) }
    })(root)
    return all
  }
  function preset(label) {
    return panelNodes().filter(function (n) { return n.tagName === 'BUTTON' && n.textContent === label })[0]
  }
  function sliders() {
    return panelNodes().filter(function (n) { return n.type === 'range' })
  }

  // Each scenario: run it, then let the coalesced frame land, then count what the
  // presenter was asked to do.
  function scenario(label, fn, next) {
    var before = overrideCalls
    var start = performance.now()
    fn()
    var sync = performance.now() - start
    void document.body.offsetHeight
    var withLayout = performance.now() - start
    setTimeout(function () {
      out.scenarios[label] = {
        syncMs: +sync.toFixed(1),
        withLayoutMs: +withLayout.toFixed(1),
        presenterCalls: overrideCalls - before,
      }
      next()
    }, 80)
  }

  scenario('panelRebuild', function () { api.panel(true) }, function () {
    scenario('presetUnchanged', function () { preset('标准').dispatchEvent(new Event('click')) }, function () {
      scenario('presetChanged', function () { preset('厚重').dispatchEvent(new Event('click')) }, function () {
        scenario('sliderDrag12', function () {
          var glass = sliders()[0]
          for (var i = 0; i < 12; i++) {
            glass.value = String(40 + i * 5)
            glass.dispatchEvent(new Event('input'))
          }
        }, function () {
          scenario('schemeStorm5', function () {
            mode = mode === 'light' ? 'dark' : 'light'
            if (mode === 'dark') document.body.setAttribute('data-ds-dark-theme', '')
            else document.body.removeAttribute('data-ds-dark-theme')
            Object.keys(base[mode]).forEach(function (t) {
              document.body.style.setProperty(t, base[mode][t], 'important')
            })
            for (var i = 0; i < 5; i++) {
              if (typeof handlers['theme/change'] === 'function') handlers['theme/change']()
            }
          }, function () {
            scenario('measureOnly', function () { api.layers() }, function () {
              out.compositeAfter = api.layers().composite
              out.verdictOk = api.diagnose().ok
              out.totalPresenterCalls = overrideCalls
              document.getElementById('report').textContent = JSON.stringify(out, null, 2)
              document.title = 'READY'
            })
          })
        })
      })
    })
  })
})()
</script>
</body>
</html>
