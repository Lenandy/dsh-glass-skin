<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-glass-skin">
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7f8"/>
      <stop offset="0.55" stop-color="#c4d1ea"/>
      <stop offset="1" stop-color="#a6b5da"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- A translucent pane over a dark window: the skin in one mark. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#101319"/>
  <rect x="8" y="8" width="48" height="48" rx="11" fill="url(#pane)" opacity="0.92"/>
  <path d="M8 34 L56 10 V19 L8 43 Z" fill="url(#sheen)"/>

  <!-- The console's own glyph: appearance / contrast. -->
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="#101319" stroke-width="3"/>
  <path d="M32 19.5a12.5 12.5 0 0 0 0 25z" fill="#101319"/>
</svg>
