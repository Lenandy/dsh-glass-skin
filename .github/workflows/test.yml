name: test

# This package has no dependencies, so the contract tests run on a bare runner.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/manifest.test.mjs
      - run: node test/bundle.test.mjs
